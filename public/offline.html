<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hors connexion — SCI Binieba</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f4f7;
        --card: #ffffff;
        --fg: #1a1d23;
        --muted: #6b7280;
        --primary: #10b77f;
        --border: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0e1116;
          --card: #161a21;
          --fg: #f3f4f7;
          --muted: #9ca3af;
          --primary: #14cf90;
          --border: #272c35;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 28px;
        max-width: 400px;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; font-size: 15px; }
      button {
        background: var(--primary);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="" class="icon" />
      <h1>Pas de connexion</h1>
      <p>
        Impossible de joindre SCI Binieba. Vérifiez votre connexion internet,
        puis réessayez.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
